<svg width="1280" height="360" viewBox="0 0 1280 360" xmlns="http://www.w3.org/2000/svg" font-family="'Space Grotesk','Segoe UI',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16211F"/>
      <stop offset="1" stop-color="#1F2E2B"/>
    </linearGradient>
    <linearGradient id="plot" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2EA98E"/>
      <stop offset="0.55" stop-color="#7FD4B8"/>
      <stop offset="1" stop-color="#E7C46A"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>

  <!-- faint grid, like a plot -->
  <g stroke="#2C3D39" stroke-width="1">
    <line x1="0" y1="90" x2="1280" y2="90"/>
    <line x1="0" y1="180" x2="1280" y2="180"/>
    <line x1="0" y1="270" x2="1280" y2="270"/>
    <line x1="320" y1="0" x2="320" y2="360"/>
    <line x1="640" y1="0" x2="640" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
  </g>

  <!-- an upward "results" line with markers, right side -->
  <g>
    <polyline fill="none" stroke="url(#plot)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
      points="700,285 780,250 855,262 930,205 1005,215 1080,150 1160,120 1230,70"/>
    <g fill="#7FD4B8">
      <circle cx="700" cy="285" r="5"/><circle cx="780" cy="250" r="5"/>
      <circle cx="855" cy="262" r="5"/><circle cx="930" cy="205" r="5"/>
      <circle cx="1005" cy="215" r="5"/><circle cx="1080" cy="150" r="5"/>
    </g>
    <circle cx="1160" cy="120" r="6" fill="#BEE7D4"/>
    <circle cx="1230" cy="70" r="7" fill="#E7C46A"/>
  </g>

  <!-- text block, left -->
  <text x="72" y="118" fill="#7FD4B8" font-size="17" font-weight="500" letter-spacing="1">DATA SCIENTIST · DATA ENGINEER</text>
  <text x="70" y="182" fill="#F1F3EE" font-size="58" font-weight="600" letter-spacing="-1.5">Sri Vamsi Chitta</text>
  <text x="72" y="228" fill="#B9C6C0" font-size="22" font-weight="400">I turn raw data into decisions people can act on.</text>

  <!-- signature line -->
  <text x="72" y="300" fill="#6E7F79" font-size="16" font-weight="500">Every project ends with a number.</text>
  <line x1="72" y1="315" x2="300" y2="315" stroke="#2EA98E" stroke-width="2"/>
</svg>
